<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cómo entregar la actividad MiniCRUD en GitHub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#191a23;--panel:#22232f;--panel-2:#262838;--border:#34364a;
  --text:#e7e7ee;--muted:#9497ab;
  --amber:#f2a154;--amber-soft:rgba(242,161,84,.12);
  --green:#7bd88f;--green-soft:rgba(123,216,143,.12);
  --blue:#7aa2f7;--blue-soft:rgba(122,162,247,.12);
  --red:#f7768e;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}

/* ── HEADER ── */
.header{padding:36px 40px 28px;max-width:720px;margin:0 auto;width:100%;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;}
.eyebrow::before{content:'● ';}
h1{font-family:'JetBrains Mono',monospace;font-size:clamp(18px,3.5vw,26px);font-weight:800;line-height:1.2;margin-bottom:8px;}
h1 span{color:var(--amber);}
.subtitle{color:var(--muted);font-size:13.5px;max-width:540px;line-height:1.6;}

/* ── PROGRESS BAR ── */
.progress-wrap{max-width:720px;margin:0 auto;padding:0 40px 20px;width:100%;}
.progress-dots{display:flex;align-items:center;gap:6px;}
.dot-step{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--muted);transition:all .25s;flex-shrink:0;cursor:default;}
.dot-step.done{background:var(--amber-soft);border-color:rgba(242,161,84,.5);color:var(--amber);}
.dot-step.active{background:var(--amber);border-color:var(--amber);color:#191a23;}
.dot-sep{flex:1;height:2px;background:var(--border);border-radius:2px;min-width:6px;}
.dot-sep.done{background:rgba(242,161,84,.4);}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:10px;}
.progress-label span{color:var(--amber);}

/* ── MAIN STEP AREA ── */
.step-area{max-width:720px;margin:0 auto;padding:0 40px;width:100%;flex:1;}

/* ── CARD ── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px 28px 24px;position:relative;}
.card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;}
.card h2{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;margin-bottom:14px;color:var(--text);}
.card h2 span{color:var(--amber);}
.card p{font-size:13.5px;color:var(--muted);line-height:1.75;margin-bottom:10px;}
.card p:last-child{margin-bottom:0;}
.card p strong{color:var(--text);}

/* ── STEP NUMBER BADGE ── */
.step-badge{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;}
.step-badge-num{width:44px;height:44px;border-radius:50%;background:var(--amber-soft);border:1.5px solid rgba(242,161,84,.5);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--amber);}
.step-badge-title{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800;color:var(--text);}
.step-badge-title span{color:var(--amber);}

/* ── SUB-PASOS ── */
.substeps{list-style:none;padding:0;margin:12px 0;}
.substeps li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(52,54,74,.4);font-size:13.5px;color:var(--muted);line-height:1.65;}
.substeps li:last-child{border-bottom:none;}
.substeps li strong{color:var(--text);}
.substep-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--amber-soft);border:1px solid rgba(242,161,84,.3);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--amber);margin-top:2px;}

/* ── TERMINAL ── */
.term{background:#14151d;border:1px solid var(--border);border-radius:8px;margin:12px 0;overflow:hidden;}
.term-bar{background:var(--panel-2);border-bottom:1px solid var(--border);padding:7px 12px;display:flex;gap:6px;align-items:center;}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.term-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-left:6px;}
.term-body{padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.85;color:var(--green);white-space:pre-wrap;}
.term-body .c{color:var(--muted);}
.term-body .a{color:var(--amber);}
.term-body .b{color:var(--blue);}

/* ── TIP / ALERTA ── */
.tip{background:var(--green-soft);border:1px solid rgba(123,216,143,.3);border-radius:10px;padding:13px 17px;margin:12px 0;font-size:13px;color:var(--text);line-height:1.65;}
.tip-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--green);letter-spacing:.06em;margin-bottom:5px;}
.tip-lbl::before{content:'💡 ';}
.alerta{background:var(--amber-soft);border:1px solid rgba(242,161,84,.35);border-radius:10px;padding:13px 17px;margin:12px 0;font-size:13px;color:var(--text);line-height:1.65;}
.alerta-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--amber);letter-spacing:.06em;margin-bottom:5px;}
.alerta-lbl::before{content:'⚠ ';}

/* ── TABLA RAMAS ── */
.tabla{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
.tabla th{text-align:left;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border);}
.tabla td{padding:9px 12px;border-bottom:1px solid rgba(52,54,74,.5);color:var(--text);}
.tabla td:first-child{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);}

/* ── NAV BUTTONS ── */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:20px 0 40px;}
.btn{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;padding:11px 22px;border-radius:8px;border:none;cursor:pointer;transition:all .2s;letter-spacing:.03em;}
.btn-prev{background:var(--panel-2);border:1.5px solid var(--border);color:var(--muted);}
.btn-prev:hover{border-color:var(--amber);color:var(--amber);}
.btn-next{background:var(--amber);color:#191a23;}
.btn-next:hover{background:#f5b374;transform:translateX(2px);}
.btn-finish{background:var(--green);color:#191a23;}
.btn-finish:hover{background:#9de8ab;}
.btn[hidden]{display:none;}

/* ── COMPLETADO ── */
.complete-card{text-align:center;padding:40px 28px;}
.complete-icon{font-size:52px;margin-bottom:20px;}
.complete-card h2{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;margin-bottom:12px;}
.complete-card h2 span{color:var(--green);}
.complete-card p{color:var(--muted);font-size:14px;max-width:460px;margin:0 auto;}
.btn-restart{margin-top:24px;background:var(--panel-2);border:1.5px solid var(--border);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 18px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-restart:hover{border-color:var(--amber);color:var(--amber);}

/* ── ANIMATIONS ── */
.step-panel{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── FOOTER ── */
.footer{max-width:720px;margin:0 auto;padding:16px 40px 24px;border-top:1px solid var(--border);text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);line-height:1.7;width:100%;}

@media(max-width:600px){
  .header,.progress-wrap,.step-area{padding-left:20px;padding-right:20px;}
  .nav{gap:12px;}
}
@media print{
  body{background:#fff;color:#111;}
  .card,.term,.tip,.alerta{background:#f5f5f5!important;border-color:#ccc!important;}
  .term-body{color:#1a6b1a!important;}
  .nav,.btn{display:none!important;}
}
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Programación Avanzada · UTU · Bachillerato Tecnológico</div>
  <h1>Entregar la actividad <span>en GitHub</span></h1>
  <p class="subtitle">Leer cada paso, realizarlo y luego continuar al siguiente.</p>
</div>

<div class="progress-wrap">
  <div class="progress-dots" id="progressDots"></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<div class="step-area">
  <div id="stepContainer"></div>

  <div class="nav">
    <button class="btn btn-prev" id="btnPrev" onclick="cambiarPaso(-1)">← Anterior</button>
    <button class="btn btn-next" id="btnNext" onclick="cambiarPaso(1)">Siguiente →</button>
    <button class="btn btn-finish" id="btnFinish" onclick="mostrarFin()" hidden>¡Listo! ✓</button>
  </div>
</div>

<div class="footer">
  Programación Avanzada · Bachillerato Tecnológico · UTU (DGETP) &nbsp;·&nbsp; Guía de entrega MiniCRUD
</div>

<script>
const pasos = [
  {
    titulo: 'Crear cuenta en GitHub',
    html: `
      <p>Ingresar a <strong>github.com</strong> y hacer clic en <strong>Sign up</strong>. Completar con email, nombre de usuario y contraseña.</p>
      <div class="tip"><div class="tip-lbl">Nombre de usuario</div>Conviene usar nombre y apellido o iniciales. Ese perfil funciona como portafolio profesional a largo plazo.</div>
      <p>Si ya existe una cuenta, pasar directamente al paso siguiente.</p>
    `
  },
  {
    titulo: 'Hacer Fork del repositorio',
    html: `
      <p>Ingresar al link del repositorio que comparte la docente. Con la sesión de GitHub iniciada, hacer clic en el botón <strong>Fork</strong> (arriba a la derecha) → <strong>Create fork</strong>.</p>
      <p>GitHub crea una copia del repositorio en la cuenta personal. Es sobre esa copia donde se van a subir los cambios.</p>
      <div class="tip"><div class="tip-lbl">¿Qué es un fork?</div>Es una copia personal del proyecto. La docente puede ver exactamente qué líneas se cambiaron comparando el fork con el proyecto base — sin necesidad de recibir archivos ZIP.</div>
    `
  },
  {
    titulo: 'Seleccionar la rama y descargar el ZIP',
    html: `
      <p>Dentro del fork, usar el selector de ramas (parte superior izquierda) para elegir la que corresponde a la actividad asignada:</p>
      <table class="tabla">
        <thead><tr><th>Rama</th><th>Actividad</th><th>Punto de partida</th></tr></thead>
        <tbody>
          <tr><td>actividad-1</td><td>Agregar sueldo (double)</td><td>Solo cod y nombre</td></tr>
          <tr><td>actividad-2</td><td>Agregar email (String)</td><td>Tiene cod, nombre y sueldo</td></tr>
          <tr><td>actividad-3</td><td>Reemplazar sueldo por categoria (String con &lt;select&gt;: Junior / Semi-Senior / Senior)</td><td>Tiene cod, nombre, sueldo y email</td></tr>
        </tbody>
      </table>
      <p>Con la rama correcta seleccionada, hacer clic en <strong>Code → Download ZIP</strong>. Descomprimir el archivo en una carpeta de trabajo.</p>
      <div class="alerta"><div class="alerta-lbl">Importante</div>Verificar que la rama seleccionada sea la correcta antes de descargar. El nombre de la rama activa aparece sobre el botón Code.</div>
    `
  },
  {
    titulo: 'Resolver la actividad en el IDE',
    html: `
      <p>Abrir el proyecto descomprimido en el IDE y realizar los cambios indicados en la consigna. Los cuatro archivos a modificar son siempre los mismos:</p>
      <div class="term">
        <div class="term-bar"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div><span class="term-lbl">Archivos a modificar</span></div>
        <div class="term-body"><span class="a">src/main/java/modelo/vo/</span>PersonaVO.java
<span class="a">src/main/java/controlador/</span>PersonaControladorServlet.java
<span class="a">src/main/webapp/WEB-INF/vista/</span>persona-form.jsp
<span class="a">src/main/webapp/WEB-INF/vista/</span>persona-lista.jsp</div>
      </div>
      <p>Probar el proyecto en Tomcat. Si el atributo nuevo no aparece en el navegador, revisar los cuatro archivos antes de continuar.</p>
      <div class="tip"><div class="tip-lbl">Verificación</div>El atributo nuevo debe verse tanto en el formulario de alta como en la tabla de la lista de personas. Si solo aparece en uno de los dos, falta modificar el otro JSP.</div>
    `
  },
  {
    titulo: 'Subir los archivos al fork en GitHub',
    html: `
      <p>Repetir este proceso para cada uno de los cuatro archivos modificados. Todo se hace desde el navegador — no se necesita instalar ningún programa.</p>
      <ul class="substeps">
        <li>
          <div class="substep-num">a</div>
          <div>En el fork de GitHub, <strong>navegar hasta la carpeta del archivo</strong> haciendo clic en las carpetas (src → main → java → modelo → vo, por ejemplo).</div>
        </li>
        <li>
          <div class="substep-num">b</div>
          <div>Hacer clic en el nombre del archivo y luego en el <strong>ícono del lápiz ✏️</strong> para abrir el editor.</div>
        </li>
        <li>
          <div class="substep-num">c</div>
          <div>Dentro del editor de GitHub, seleccionar todo con <strong>Ctrl + A</strong> y eliminar el contenido.</div>
        </li>
        <li>
          <div class="substep-num">d</div>
          <div>En el IDE, abrir el mismo archivo, seleccionar todo con <strong>Ctrl + A</strong> y copiarlo con <strong>Ctrl + C</strong>.</div>
        </li>
        <li>
          <div class="substep-num">e</div>
          <div>Volver al navegador y pegar el contenido con <strong>Ctrl + V</strong>.</div>
        </li>
        <li>
          <div class="substep-num">f</div>
          <div>Hacer clic en <strong>Commit changes</strong>. Escribir un mensaje descriptivo y confirmar con <strong>Commit directly to actividad-X branch</strong>.</div>
        </li>
      </ul>
      <div class="term">
        <div class="term-bar"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div><span class="term-lbl">Ejemplos de mensajes de commit</span></div>
        <div class="term-body"><span class="c">✓ Mensajes correctos:</span>
Agregar atributo sueldo y getter/setter en PersonaVO
Leer parámetro sueldo en método agregar() del Servlet
Agregar campo sueldo en persona-form.jsp
Agregar columna Sueldo en persona-lista.jsp

<span class="c">✗ Mensajes que no sirven:</span>
cambios
listo
actividad 1</div>
      </div>
    `
  },
  {
    titulo: 'Verificar los cambios antes de entregar',
    html: `
      <p>Desde la página principal del fork (con la rama de la actividad seleccionada), hacer clic en el texto <strong>"X commits ahead"</strong>.</p>
      <p>GitHub muestra todos los archivos modificados con las líneas agregadas en verde y las eliminadas en rojo. Si algún archivo no aparece, significa que no se guardó el commit — repetir el paso 5 para ese archivo.</p>
      <div class="tip"><div class="tip-lbl">Esta es la vista que usa la docente para corregir</div>Si los cuatro archivos aparecen con los cambios correctos en esa vista, la entrega está completa.</div>
      <div class="alerta"><div class="alerta-lbl">Verificar</div>Deben aparecer exactamente los cuatro archivos modificados. Si aparecen más o menos, revisar si se editó el archivo correcto en la rama correcta.</div>
    `
  },
  {
    titulo: 'Entregar la URL del fork en la tarea',
    html: `
      <p>Copiar la URL del fork con la rama de la actividad seleccionada. Se ve así:</p>
      <div class="term">
        <div class="term-bar"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div><span class="term-lbl">URL a entregar</span></div>
        <div class="term-body"><span class="b">https://github.com/</span><span class="a">mi-usuario</span><span class="b">/MiniCRUD-Practica1_Tema2/tree/</span><span class="a">actividad-1</span></div>
      </div>
      <p>Ingresar a la tarea en Crea y pegar esa URL como respuesta o comentario de entrega.</p>
      <p><strong>No es necesario adjuntar ningún archivo ZIP.</strong> La docente accede directamente al fork para ver los cambios realizados.</p>
      <div class="tip"><div class="tip-lbl">Verificar la URL antes de pegar</div>Asegurarse de que incluya el nombre de la rama al final (…/tree/actividad-1). Si la URL termina solo en el nombre del repositorio sin la rama, la docente no puede ver los cambios de esa actividad.</div>
      <div class="alerta"><div class="alerta-lbl">Recordar</div>El formulario con las preguntas orientadoras ya fue enviado antes de comenzar este proceso. Si no se envió todavía, hacerlo antes de entregar la URL.</div>
    `
  }
];

let pasoActual = 0;

function renderProgreso() {
  const dots = document.getElementById('progressDots');
  const label = document.getElementById('progressLabel');
  dots.innerHTML = '';
  pasos.forEach((_, i) => {
    if (i > 0) {
      const sep = document.createElement('div');
      sep.className = 'dot-sep' + (i <= pasoActual ? ' done' : '');
      dots.appendChild(sep);
    }
    const d = document.createElement('div');
    d.className = 'dot-step' + (i < pasoActual ? ' done' : i === pasoActual ? ' active' : '');
    d.textContent = i + 1;
    dots.appendChild(d);
  });
  label.innerHTML = `Paso <span>${pasoActual + 1}</span> de <span>${pasos.length}</span> — ${pasos[pasoActual].titulo}`;
}

function renderPaso() {
  const container = document.getElementById('stepContainer');
  const paso = pasos[pasoActual];
  container.innerHTML = `
    <div class="step-panel">
      <div class="card">
        <div class="step-badge">
          <div class="step-badge-num">${String(pasoActual + 1).padStart(2,'0')}</div>
          <div class="step-badge-title">${paso.titulo}</div>
        </div>
        ${paso.html}
      </div>
    </div>`;

  document.getElementById('btnPrev').hidden = pasoActual === 0;
  document.getElementById('btnNext').hidden = pasoActual === pasos.length - 1;
  document.getElementById('btnFinish').hidden = pasoActual !== pasos.length - 1;
  renderProgreso();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function cambiarPaso(dir) {
  const siguiente = pasoActual + dir;
  if (siguiente >= 0 && siguiente < pasos.length) {
    pasoActual = siguiente;
    renderPaso();
  }
}

function mostrarFin() {
  const container = document.getElementById('stepContainer');
  container.innerHTML = `
    <div class="step-panel">
      <div class="card complete-card">
        <div class="complete-icon">✅</div>
        <h2>Entrega <span>completa</span></h2>
        <p>El formulario fue enviado con la URL del fork. La docente puede ver todos los cambios realizados directamente en GitHub.</p>
        <button class="btn-restart" onclick="reiniciar()">↺ Ver la guía de nuevo</button>
      </div>
    </div>`;
  document.getElementById('btnPrev').hidden = true;
  document.getElementById('btnNext').hidden = true;
  document.getElementById('btnFinish').hidden = true;

  // marcar todos como done
  const dots = document.getElementById('progressDots');
  dots.querySelectorAll('.dot-step').forEach(d => {
    d.classList.remove('active');
    d.classList.add('done');
  });
  dots.querySelectorAll('.dot-sep').forEach(d => d.classList.add('done'));
  document.getElementById('progressLabel').innerHTML = `<span>¡Todos los pasos completados!</span>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function reiniciar() {
  pasoActual = 0;
  renderPaso();
}

// Init
renderPaso();
</script>
</body>
</html>
